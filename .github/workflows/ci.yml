name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python 3.12
      - name: Install dev extras
        run: uv pip install -e ".[dev]"
      - name: Run pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install dev extras
        run: uv pip install -e ".[dev]"
      - name: Import smoke test
        run: |
          source .venv/bin/activate
          python -c "import alphaex.sweeper, alphaex.submitter, numpy; print('ok')"
      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest --cov=alphaex --cov-report=term-missing

  local-slurm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python
        run: uv venv --python 3.12
      - name: Install dev extras
        run: uv pip install -e ".[dev]"
      - name: Bring up mini-slurm
        run: bash docker/setup.sh
      - name: Run local-slurm integration test
        env:
          ALPHAEX_LOCAL_SLURM: "1"
        run: |
          source .venv/bin/activate
          pytest test/test_submitter_local.py -v
      - name: Show docker logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs
      - name: Teardown
        if: always()
        run: bash docker/teardown.sh
