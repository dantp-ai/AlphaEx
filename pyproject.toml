[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaex"
version = "0.1.0"
description = "AlphaEx: A Python Toolkit for Managing Large Number of Experiments"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Yi Wan", email = "wan6@ualberta.ca"}]
requires-python = ">=3.9"
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/AmiiThinks/AlphaEx"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pre-commit>=3.5",
]

[tool.setuptools.packages.find]
exclude = ["test*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--ignore=test/test_submitter.py"
